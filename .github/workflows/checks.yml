name: checks

# NOTE: this file must stay ASCII-only.
# GitHub runs inline `run:` blocks through Windows PowerShell 5.1, which reads
# script text as ANSI - any non-ASCII characters get mangled and break the step
# (first CI run on 2026-09-10 failed exactly on this). All checks live in
# tools/check.ps1 - a UTF-8 file WITH BOM, where non-ASCII text is safe.

on:
  push:
  pull_request:

jobs:
  checks:
    name: Syntax and static analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber

      - name: Run repository checks
        shell: powershell
        run: ./tools/check.ps1
